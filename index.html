<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消防安全公共知识 · 刷题</title>
<style>
  :root {
    --primary: #d32f2f; --primary-dark: #b71c1c;
    --bg: #f5f6fa; --card: #fff; --text: #2c2c2c; --muted: #888;
    --ok: #2e7d32; --ok-bg: #e8f5e9; --err: #c62828; --err-bg: #fdecea;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background:var(--bg); color:var(--text); padding-bottom: 80px; }
  header { background:var(--primary); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  header h1 { font-size:18px; font-weight:600; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }

  .toolbar { display:flex; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid #eee; flex-wrap:wrap; }
  .toolbar select, .toolbar button { padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; background:#fff; }
  .toolbar button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .toolbar .spacer { flex:1; }

  .progress { padding:8px 16px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .progress .bar-wrap { flex:1; margin:0 12px; background:#e0e0e0; border-radius:6px; height:8px; overflow:hidden; align-self:center; }
  .progress .bar { height:100%; width:0; background:var(--primary); border-radius:6px; transition:width .3s; }

  #quiz-area { padding:14px 12px; }
  .card { background:var(--card); border-radius:14px; padding:18px 16px; box-shadow:0 1px 6px rgba(0,0,0,.07); }
  .q-head { font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; }
  .q-head .tag { background:var(--primary); color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; }
  .q-stem { font-size:16px; line-height:1.7; margin-bottom:14px; }
  .q-stem .blank { display:inline-block; min-width:60px; border-bottom:2px solid var(--primary); margin:0 4px; }

  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt { border:2px solid #e0e0e0; border-radius:10px; padding:12px 14px; font-size:15px; line-height:1.5; cursor:pointer; transition:all .15s; }
  .opt:active { transform:scale(.98); }
  .opt.correct { border-color:var(--ok); background:var(--ok-bg); }
  .opt.wrong { border-color:var(--err); background:var(--err-bg); }

  .judge-row { display:flex; gap:14px; }
  .judge-btn { flex:1; padding:18px; font-size:20px; font-weight:700; border:2px solid #e0e0e0; border-radius:12px; cursor:pointer; text-align:center; background:#fff; }
  .judge-btn.correct { border-color:var(--ok); background:var(--ok-bg); }
  .judge-btn.wrong { border-color:var(--err); background:var(--err-bg); }

  .fill-input { width:100%; padding:12px 14px; font-size:16px; border:2px solid #e0e0e0; border-radius:10px; }
  .fill-input:focus { outline:none; border-color:var(--primary); }
  .fill-submit { margin-top:12px; width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; }

  .short-ans { margin-top:14px; border-top:1px dashed #ddd; padding-top:12px; }
  .short-ans summary { cursor:pointer; color:var(--primary); font-size:14px; font-weight:600; }
  .short-ans .ans-body { margin-top:8px; font-size:14px; line-height:1.8; color:#444; background:#fafafa; padding:10px; border-radius:8px; }

  .self-row { display:flex; gap:10px; margin-top:14px; }
  .self-btn { flex:1; padding:13px; font-size:15px; border:none; border-radius:10px; cursor:pointer; color:#fff; font-weight:600; }
  .self-ok { background:var(--ok); }
  .self-no { background:var(--err); }
  .self-btn:active { transform:scale(.98); }

  .feedback { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:15px; display:none; line-height:1.6; }
  .feedback.show { display:block; }
  .feedback.ok { background:var(--ok-bg); color:var(--ok); }
  .feedback.err { background:var(--err-bg); color:var(--err); }

  .nav-row { display:flex; gap:10px; margin-top:16px; }
  .nav-row button { flex:1; padding:13px; font-size:15px; border:none; border-radius:10px; cursor:pointer; }
  #btn-prev { background:#eee; color:#333; }
  #btn-next { background:var(--primary); color:#fff; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .stat { background:var(--card); border-radius:10px; padding:10px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .stat .num { font-size:20px; font-weight:700; color:var(--primary); }
  .stat .lbl { font-size:11px; color:var(--muted); margin-top:2px; }

  #empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:15px; line-height:2; }
  #empty button { margin-top:16px; padding:10px 24px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }

  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; padding:10px 12px; display:flex; gap:8px; }
  footer button { flex:1; padding:10px; border:none; border-radius:8px; font-size:14px; cursor:pointer; background:#f0f0f0; color:#333; }
  footer button.primary { background:var(--primary); color:#fff; }
</style>
</head>
<body>

<header>
  <h1>🔥 消防安全公共知识 · 刷题</h1>
  <div class="sub">卷A~E · 210题 · 本地离线使用</div>
</header>

<div class="toolbar">
  <select id="paper-select">
    <option value="ALL">全部卷</option>
    <option value="A">卷A</option>
    <option value="B">卷B</option>
    <option value="C">卷C</option>
    <option value="D">卷D</option>
    <option value="E">卷E</option>
  </select>
  <select id="type-select">
    <option value="ALL">全部题型</option>
    <option value="choice">选择题</option>
    <option value="judge">判断题</option>
    <option value="fill">填空题</option>
    <option value="short">简答题</option>
  </select>
  <button id="btn-random">🎲 随机</button>
  <button id="btn-wrong">📕 错题</button>
</div>

<div class="progress" id="progress-bar">
  <span id="p-pos">0/0</span>
  <div class="bar-wrap"><div class="bar" id="p-bar"></div></div>
  <span id="p-pct">0%</span>
</div>

<div id="quiz-area"></div>
<div id="empty" style="display:none;">
  🎉 没有题了！<br>
  <button onclick="resetProgress()">重置进度 / 清空错题</button>
</div>

<div class="stats" id="stats-row">
  <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">已刷</div></div>
  <div class="stat"><div class="num" id="s-ok">0</div><div class="lbl">答对</div></div>
  <div class="stat"><div class="num" id="s-rate">0%</div><div class="lbl">正确率</div></div>
</div>

<footer>
  <button id="btn-prev">◀ 上一题</button>
  <button class="primary" id="btn-next">下一题 ▶</button>
</footer>

<script>
// ===== 数据（内嵌） =====
const QUESTIONS = [{"paper": "A", "type": "fill", "no": 1, "stem": "一旦发生烧（烫）伤，最简单而有效的急救处理是冷疗，即用凉水冲洗或将烧伤处放入凉水中_____至 20 分钟，可使烧伤程度减轻并减少疼痛感。", "answer": "10"}, {"paper": "A", "type": "fill", "no": 2, "stem": "购买电器的时候应该选择具有安全认证标志的产品。_____认证对于中国市场的电器是必需的。", "answer": "CCC"}, {"paper": "A", "type": "fill", "no": 3, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于_____% 时，就不能维持燃烧。", "answer": "15"}, {"paper": "A", "type": "fill", "no": 4, "stem": "轻微火灾：无人员伤亡且直接财产损失低于_____元的火灾。", "answer": "1000"}, {"paper": "A", "type": "fill", "no": 5, "stem": "通过灌注惰性气体（如二氧化碳、氮气、水蒸气等）来降低空间的氧浓度，从而达到灭火的目的属于_____火。", "answer": "窒息"}, {"paper": "A", "type": "fill", "no": 6, "stem": "热传播有三种方式：热传导、热对流和_____。", "answer": "热辐射"}, {"paper": "A", "type": "fill", "no": 7, "stem": "火灾隐患可分为：_____、一般火灾隐患。", "answer": "重大火灾隐患"}, {"paper": "A", "type": "fill", "no": 8, "stem": "特别重大火灾指造成 30 人以上死亡，或者 100 人以上重伤和死亡，或者受灾 100 户以上，或者_____亿元以上直接财产损失的火灾。", "answer": "3"}, {"paper": "A", "type": "fill", "no": 9, "stem": "燃烧的发生和发展，必须具备三个必要条件，即可燃物、助燃物和_____，通常称为燃烧三要素。", "answer": "引火源"}, {"paper": "A", "type": "fill", "no": 10, "stem": "近年来，我国发生的电气火灾每年都在 10 万起以上，占全年火灾总数的_____% 左右，导致的人员伤亡及经济损失在各类火灾中居首位。", "answer": "30"}, {"paper": "A", "type": "choice", "no": 1, "stem": "以下（）行为是正确的。", "options": ["A. 用取暖器烘烤衣物", "B. 同时使用多个大功率电器", "C. 电子设备充完电后及时拔掉插头", "D. 电器长时间通电运行"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 2, "stem": "根据《中华人民共和国消防法》的规定，消防工作的原则是（）。", "options": ["A. 政府统一领导、部门依法监管、单位全面负责、公民积极参与", "B. 消防安全责任制", "C. 专门机关和群众相结合", "D. 预防为主、防消结合"], "answer": "A"}, {"paper": "A", "type": "choice", "no": 3, "stem": "根据《中华人民共和国消防法》的规定，我国消防工作贯彻（）的方针。", "options": ["A. 以消为主，以防为辅", "B. 预防为主，防消结合", "C. 预防为主，消防结合", "D. 以防为主，以消为辅"], "answer": "B"}, {"paper": "A", "type": "choice", "no": 4, "stem": "在家外失火的情况下，有毒烟气已封锁逃生通道，被困人员采取的最佳方式是（）。", "options": ["A. 冒险跳楼", "B. 立即开门向外跑", "C. 关好房门，固守待援", "D. 乘坐电梯逃生"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 5, "stem": "电动自行车可以停放在（）。", "options": ["A. 居民家中", "B. 划定的非机动车停放点（车棚）", "C. 消防车通道", "D. 高层民用建筑的公共门厅、疏散走道、楼梯间、安全出口"], "answer": "B"}, {"paper": "A", "type": "choice", "no": 6, "stem": "《火灾分类》（GB/T 4968-2008）规定，火灾根据可燃物的类型和燃烧特性，可以分为（）大类。", "options": ["A. 三", "B. 四", "C. 五", "D. 六"], "answer": "D"}, {"paper": "A", "type": "choice", "no": 7, "stem": "2024 年 1 月 24 日 15 时许，江西省新余市渝水区一临街店铺发生火灾，事故已造成 39 人死亡、9 人受伤。起火建筑为六层商住一体砖混结构建筑，起火部位在负一楼，并迅速蔓延至一楼、二楼的商业店铺。经初步查明，该楼地下一层正在进行冷库装修，该起事故是因施工人员违规动火施工造成的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "A"}, {"paper": "A", "type": "choice", "no": 8, "stem": "烟气中的大多数气体均比空气重，但在高温情况下烟气仍向上浮动，所以室内的烟气越是高处浓度越高。据试验，在火灾发生之后 11 ～ 13 分钟内房间顶部的二氧化碳浓度约为（）%，中部约为 5%。地面约为 2%。", "options": ["A.7", "B.8", "C.9", "D.10"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 9, "stem": "无人员伤亡且直接财产损失低于 1000 元的火灾属于（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "D"}, {"paper": "A", "type": "choice", "no": 10, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于（）时，就不能维持燃烧。", "options": ["A.5%", "B.10%", "C.15%", "D.20%"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 11, "stem": "检查燃气管道泄漏最简便有效的方法是（）。", "options": ["A. 涂抹肥皂水", "B. 划火柴", "C. 闻气味", "D. 听声音"], "answer": "A"}, {"paper": "A", "type": "choice", "no": 12, "stem": "下列灭火方法中属于化学抑制的是（）。", "options": ["A. 二氧化碳灭火", "B. 水喷雾灭火", "C. 干粉灭火", "D. 石棉布捂盖燃烧物"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 13, "stem": "将火源附近的可燃、易燃、易爆和助燃物品搬走；拆除与火源毗连的易燃建（构）筑物，形成阻止火势蔓延的空间地带属于（）机理。", "options": ["A. 冷却灭火", "B. 隔离灭火", "C. 窒息灭火", "D. 化学抑制灭火"], "answer": "B"}, {"paper": "A", "type": "choice", "no": 14, "stem": "往燃烧物上喷射七氟丙烷灭火剂、干粉灭火剂，中断燃烧链式反应，这样的灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "D"}, {"paper": "A", "type": "choice", "no": 15, "stem": "下列物质发生的火灾，不属于 A 类火灾的是（）。", "options": ["A. 纸张", "B. 焦炭", "C. 沥青", "D. 橡胶"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 16, "stem": "灭火器正确使用的四字口诀指（）。", "options": ["A. “提、拔、对、喷”", "B. “提、拔、握、压”", "C. “提、摇、握、压”", "D. “提、摇、对、喷”"], "answer": "B"}, {"paper": "A", "type": "choice", "no": 17, "stem": "根据《消防法》第六十条的规定，个人损坏、挪用或者擅自拆除、停用消防设施、器材的，处警告或者（）元以下罚款；对于单位的违法行为，责令改正，处五千元以上五万元以下罚款。", "options": ["A. 一百", "B. 二百", "C. 五百", "D. 一千"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 18, "stem": "2024 年 4 月 4 日 4 时 12 分许，广东省东莞市万江街道东莞康怡护理院发生火灾。过火面积约 20m²,造成 4 人死亡、9 人受伤。事故直接原因为 303 房间 9 号床上由打火机明火引燃床上可燃物品，该起事故属于（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "C"}, {"paper": "A", "type": "choice", "no": 19, "stem": "火灾的种类按燃烧物的性质划分，共分为 A、B、C、D、E、F 六类。由石蜡所引起的火灾，属于（）火灾。", "options": ["A.A 类", "B.B 类", "C.C 类", "D.D 类"], "answer": "B"}, {"paper": "A", "type": "choice", "no": 20, "stem": "油锅起火时，最佳的灭火方式是（）。", "options": ["A. 用嘴吹", "B. 用水灭火", "C. 迅速盖上锅盖或灭火毯", "D. 不处理，等待火势变小"], "answer": "C"}, {"paper": "A", "type": "judge", "no": 1, "stem": "高层住宅发生火灾时，可以乘坐电梯逃生。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 2, "stem": "防火分隔物是防止火灾由内部向外部蔓延的一项重要措施。（）", "answer": "√"}, {"paper": "A", "type": "judge", "no": 3, "stem": "厨房发生火灾后，如果火焰还很小，可以尝试用湿毛巾、灭火毯或防火毛巾等封闭火源，以切断氧气的供应。或者可以使用灭火器喷射消防泡沫，灭火器喷射距离一般在 1 ～ 3 米。（）", "answer": "√"}, {"paper": "A", "type": "judge", "no": 4, "stem": "配电线路接触不良是指配电线路的带电导体之间、带电导体与连接端子之间连接不可靠，导致接触电阻降低，在接头处产生高温，引燃周围可燃物从而引发火灾。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 5, "stem": "A 类火灾指液体或可熔化的固体物质火灾。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 6, "stem": "用水扑灭一般固体物质引起的火灾，主要是通过冷却作用来实现的，属于冷却灭火。（）", "answer": "√"}, {"paper": "A", "type": "judge", "no": 7, "stem": "特别重大火灾是指造成 30 人以上死亡，或者 100 人以上重伤，或者 1 亿元以上直接经济损失的火灾。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 8, "stem": "下雨天电动车可以在门厅内充电。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 9, "stem": "配电线路中发生短路的表象特征为线路内电流急剧降低，使带电导体温度急剧降低，引燃电线电缆的绝缘外皮及周边可燃物，进而引发火灾。（）", "answer": "×"}, {"paper": "A", "type": "judge", "no": 10, "stem": "自动喷水—泡沫联用系统在喷水的同时喷出泡沫，泡沫覆盖于燃烧液体或固体的表面，在发挥冷却作用的同时，将可燃物与空气隔开，从而灭火属于窒息灭火。（）", "answer": "√"}, {"paper": "A", "type": "short", "no": 1, "stem": "消防安全“四个能力”是什么？", "answer": "（1）检查消除火灾隐患能力。（2）扑救初期火灾能力。（3）组织人员疏散逃生能力。（4）消防宣传教育培训能力。"}, {"paper": "A", "type": "short", "no": 2, "stem": "什么是“三合一”建筑？有哪些特点？", "answer": "所谓“三合一”建筑就是有些企业在同时设置有厂房、仓库、员工宿舍的建筑中或是在居住用房等民用建筑中，从事生产、储存、经营等活动，而住宿部分与其他部分又未按规定采取必要的防火分隔和设置消防设施，其消防安全条件与建筑使用性质不相适应，具有较高的火灾危险性的建筑物。这种建筑物的特点是存放易燃易爆物品多，聚集人员多，用火用电多，建筑设施简陋，内部拥挤不堪，安全疏散不畅。有的业主为了防盗，在窗户上安设防盗网，在走道、楼梯上安装防盗门。同时，这类建筑物内的消防设施不全、管理不善，员工缺乏应有的消防安全常识，不经培训就上岗，没有最起码的自防自救能力，并且这类建筑往往是在城乡结合或者小镇上，距离消防救援队较远。故一旦“三合一”建筑发生火灾，极易造成群死群伤的结果。"}, {"paper": "B", "type": "fill", "no": 1, "stem": "一旦发生烧（烫）伤，最简单而有效的急救处理是冷疗，即用凉水冲洗或将烧伤处放入凉水中_____至 20 分钟，可使烧伤程度减轻并减少疼痛感。", "answer": "10"}, {"paper": "B", "type": "fill", "no": 2, "stem": "特别重大火灾指造成 30 人以上死亡，或者 100 人以上重伤和死亡，或者受灾 100 户以上，或者_____亿元以上直接财产损失的火灾。", "answer": "3"}, {"paper": "B", "type": "fill", "no": 3, "stem": "近年来，我国发生的电气火灾每年都在 10 万起以上，占全年火灾总数的_____% 左右，导致的人员伤亡及经济损失在各类火灾中居首位。", "answer": "30"}, {"paper": "B", "type": "fill", "no": 4, "stem": "轻微火灾：无人员伤亡且直接财产损失低于_____元的火灾。", "answer": "1000"}, {"paper": "B", "type": "fill", "no": 5, "stem": "通过灌注惰性气体（如二氧化碳、氮气、水蒸气等）来降低空间的氧浓度，从而达到灭火的目的属于_____火。", "answer": "窒息"}, {"paper": "B", "type": "fill", "no": 6, "stem": "热传播有三种方式：热传导、热对流和_____。", "answer": "热辐射"}, {"paper": "B", "type": "fill", "no": 7, "stem": "燃烧的发生和发展，必须具备三个必要条件，即可燃物、助燃物和_____，通常称为燃烧三要素。", "answer": "引火源"}, {"paper": "B", "type": "fill", "no": 8, "stem": "购买电器的时候应该选择具有安全认证标志的产品。_____认证对于中国市场的电器是必需的。", "answer": "CCC"}, {"paper": "B", "type": "fill", "no": 9, "stem": "火灾隐患可分为：_____、一般火灾隐患。", "answer": "重大火灾隐患"}, {"paper": "B", "type": "fill", "no": 10, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于_____% 时，就不能维持燃烧。", "answer": "15"}, {"paper": "B", "type": "choice", "no": 1, "stem": "根据《消防法》第六十条的规定，个人损坏、挪用或者擅自拆除、停用消防设施、器材的，处警告或者（）元以下罚款；对于单位的违法行为，责令改正，处五千元以上五万元以下罚款。", "options": ["A. 一百", "B. 二百", "C. 五百", "D. 一千"], "answer": "C"}, {"paper": "B", "type": "choice", "no": 2, "ste ptions": ["A.7", "B.8", "C.9", "D.10"], "answer": "C"}, {"paper": "B", "type": "choice", "no": 14, "stem": "利用灭火毯、沙土等覆盖燃烧物，这种灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "B"}, {"paper": "B", "type": "choice", "no": 15, "stem": "根据《中华人民共和国消防法》的规定，消防工作的原则是（）。", "options": ["A. 政府统一领导、部门依法监管、单位全面负责、公民积极参与", "B. 消防安全责任制", "C. 专门机关和群众相结合", "D. 预防为主、防消结合"], "answer": "A"}, {"paper": "B", "type": "choice", "no": 16, "stem": "在家外失火的情况下，有毒烟气已封锁逃生通道，被困人员采取的最佳方式是（）。", "options": ["A. 冒险跳楼", "B. 立即开门向外跑", "C. 关好房门，固守待援", "D. 乘坐电梯逃生"], "answer": "C"}, {"paper": "B", "type": "choice", "no": 17, "stem": "油锅起火时，最佳的灭火方式是（）。", "options": ["A. 用嘴吹", "B. 用水灭火", "C. 迅速盖上锅盖或灭火毯", "D. 不处理，等待火势变小"], "answer": "C"}, {"paper": "B", "type": "choice", "no": 18, "stem": "下列灭火方法中属于化学抑制的是（）。", "options": ["A. 二氧化碳灭火", "B. 水喷雾灭火", "C. 干粉灭火", "D. 石棉布捂盖燃烧物"], "answer": "C"}, {"paper": "B", "type": "choice", "no": 19, "stem": "2024 年 1 月 24 日 15 时许，江西省新余市渝水区一临街店铺发生火灾，事故已造成 39 人死亡、9 人受伤。起火建筑为六层商住一体砖混结构建筑，起火部位在负一楼，并迅速蔓延至一楼、二楼的商业店铺。经初步查明，该楼地下一层正在进行冷库装修，该起事故是因施工人员违规动火施工造成的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "A"}, {"paper": "B", "type": "choice", "no": 20, "stem": "电动自行车可以停放在（）。", "options": ["A. 居民家中", "B. 划定的非机动车停放点（车棚）", "C. 消防车通道", "D. 高层民用建筑的公共门厅、疏散走道、楼梯间、安全出口"], "answer": "B"}, {"paper": "B", "type": "judge", "no": 1, "stem": "厨房发生火灾后，如果火焰还很小，可以尝试用湿毛巾、灭火毯或防火毛巾等封闭火源，以切断氧气的供应。或者可以使用灭火器喷射消防泡沫，灭火器喷射距离一般在 1 ～ 3 米。（）", "answer": "√"}, {"paper": "B", "type": "judge", "no": 2, "stem": "配电线路中发生短路的表象特征为线路内电流急剧降低，使带电导体温度急剧降低，引燃电线电缆的绝缘外皮及周边可燃物，进而引发火灾。（）", "answer": "×"}, {"paper": "B", "type": "judge", "no": 3, "stem": "使用燃气时，应保持室内通风良好，不要远离厨房。（）", "answer": "√"}, {"paper": "B", "type": "judge", "no": 4, "stem": "下雨天电动车可以在门厅内充电。（）", "answer": "×"}, {"paper": "B", "type": "judge", "no": 5, "stem": "当厨房发生油火时，可以用水灭火。（）", "answer": "×"}, {"paper": "B", "type": "judge", "no": 6, "stem": "火源附近的可燃、易燃、易爆和助燃物品搬走属于窒息灭火。（）", "answer": "×"}, {"paper": "B", "type": "judge", "no": 7, "stem": "人身着火时，身上如果穿的是单衣，应迅速趴在地上；背后衣服着火时，应仰面躺在地上；衣服前后都着火时，则应在地上来回滚动，利用身体隔绝空气，覆盖火焰，窒息灭火。（）", "answer": "√"}, {"paper": "B", "type": "judge", "no": 8, "stem": "高层住宅发生火灾时，可以乘坐电梯逃生。（）", "answer": "×"}, {"paper": "B", "type": "judge", "no": 9, "stem": "眼部烧伤，严禁用手或手帕等揉擦。（）", "answer": "√"}, {"paper": "B", "type": "judge", "no": 10, "stem": "A 类火灾指液体或可熔化的固体物质火灾。（）", "answer": "×"}, {"paper": "B", "type": "short", "no": 1, "stem": "消防安全“四个能力”是什么？", "answer": "（1）检查消除火灾隐患能力。（2）扑救初期火灾能力。（3）组织人员疏散逃生能力。（4）消防宣传教育培训能力。"}, {"paper": "B", "type": "short", "no": 2, "stem": "消防安全“四懂四会”是什么？", "answer": "“四懂”是指懂得岗位火灾的危险性，懂得预防火灾的措施，懂得扑救火灾的方法，懂得逃生路线和方法。“四会”是指会使用消防器材，会报火警，会扑救初起火灾，会组织疏散逃生。"}, {"paper": "C", "type": "fill", "no": 1, "stem": "购买电器的时候应该选择具有安全认证标志的产品。_____认证对于中国市场的电器是必需的。", "answer": "CCC"}, {"paper": "C", "type": "fill", "no": 2, "stem": "轻微火灾：无人员伤亡且直接财产损失低于_____元的火灾。", "answer": "1000"}, {"paper": "C", "type": "fill", "no": 3, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于_____% 时，就不能维持燃烧。", "answer": "15"}, {"paper": "C", "type": "fill", "no": 4, "stem": "特别重大火灾指造成 30 人以上死亡，或者 100 人以上重伤和死亡，或者受灾 100 户以上，或者_____亿元以上直接财产损失的火灾。", "answer": "3"}, {"paper": "C", "type": "fill", "no": 5, "stem": "近年来，我国发生的电气火灾每年都在 10 万起以上，占全年火灾总数的_____% 左右，导致的人员伤亡及经济损失在各类火灾中居首位。", "answer": "30"}, {"paper": "C", "type": "fill", "no": 6, "stem": "通过灌注惰性气体（如二氧化碳、氮气、水蒸气等）来降低空间的氧浓度，从而达到灭火的目的属于_____火。", "answer": "窒息"}, {"paper": "C", "type": "fill", "no": 7, "stem": "火灾隐患可分为：_____、一般火灾隐患。", "answer": "重大火灾隐患"}, {"paper": "C", "type": "fill", "no": 8, "stem": "热传播有三种方式：热传导、热对流和_____。", "answer": "热辐射"}, {"paper": "C", "type": "fill", "no": 9, "stem": "燃烧的发生和发展，必须具备三个必要条件，即可燃物、助燃物和_____，通常称为燃烧三要素。", "answer": "引火源"}, {"paper": "C", "type": "fill", "no": 10, "stem": "一旦发生烧（烫）伤，最简单而有效的急救处理是冷疗，即用凉水冲洗或将烧伤处放入凉水中_____至 20 分钟，可使烧伤程度减轻并减少疼痛感。", "answer": "10"}, {"paper": "C", "type": "choice", "no": 1, "stem": "根据《消防法》第六十条的规定，个人损坏、挪用或者擅自拆除、停用消防设施、器材的，处警告或者（）元以下罚款；对于单位的违法行为，责令改正，处五千元以上五万元以下罚款。", "options": ["A. 一百", "B. 二百", "C. 五百", "D. 一千"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 2, "stem": "利用灭火毯、沙土等覆盖燃烧物，这种灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 3, "stem": "如果您有一辆电动自行车，您应该（）。", "options": ["A. 将电池带回家中充电", "B. 改装电动自行车", "C. 私拉电线和插座充电", "D. 经常检查维护"], "answer": "D"}, {"paper": "C", "type": "choice", "no": 4, "stem": "《火灾分类》（GB/T 4968-2008）规定，火灾根据可燃物的类型和燃烧特性，可以分为（）大类。", "options": ["A. 三", "B. 四", "C. 五", "D. 六"], "answer": "D"}, {"paper": "C", "type": "choice", "no": 5, "stem": "油锅起火时，最佳的灭火方式是（）。", "options": ["A. 用嘴吹", "B. 用水灭火", "C. 迅速盖上锅盖或灭火毯", "D. 不处理，等待火势变小"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 6, "stem": "在家中失火的情况下，如果着火点处于逃生必经之路上，以下（）行为是不正确的。", "options": ["A. 逃至不受有毒烟气侵袭的房间，关闭房门，打开窗户", "B. 打湿衣物堵住门缝", "C. 拨打 119 报警电话", "D. 跳楼逃生"], "answer": "D"}, {"paper": "C", "type": "choice", "no": 7, "stem": "火灾的种类按燃烧物的性质划分，共分为 A、B、C、D、E、F 六类。由石蜡所引起的火灾，属于（）火灾。", "options": ["A.A 类", "B.B 类", "C.C 类", "D.D 类"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 8, "stem": "2024 年 1 月 24 日 15 时许，江西省新余市渝水区一临街店铺发生火灾，事故已造成 39 人死亡、9 人受伤。起火建筑为六层商住一体砖混结构建筑，起火部位在负一楼，并迅速蔓延至一楼、二楼的商业店铺。经初步查明，该楼地下一层正在进行冷库装修，该起事故是因施工人员违规动火施工造成的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "A"}, {"paper": "C", "type": "choice", "no": 9, "stem": "灭火器正确使用的四字口诀指（）。", "options": ["A. “提、拔、对、喷”", "B. “提、拔、握、压”", "C. “提、摇、握、压”", "D. “提、摇、对、喷”"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 10, "stem": "2024 年 2 月 23 日凌晨 4 时 35 分许，南京市雨花台区西柿路 9 号明尚西苑小区居民住宅 6 号楼发生火灾事故，造成 15 人死亡、2 人重伤、42 人轻伤或轻微伤，直接经济损失 3300 余万元。经调查认定，这是一起违规改装的电动自行车超标大容量锂离子电池热失控起火引起的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 一般火灾"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 11, "stem": "往燃烧物上喷射七氟丙烷灭火剂、干粉灭火剂，中断燃烧链式反应，这样的灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "D"}, {"paper": "C", "type": "choice", "no": 12, "stem": "以下（）行为是正确的。", "options": ["A. 用取暖器烘烤衣物", "B. 同时使用多个大功率电器", "C. 电子设备充完电后及时拔掉插头", "D. 电器长时间通电运行"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 13, "stem": "下列灭火方法中属于化学抑制的是（）。", "options": ["A. 二氧化碳灭火", "B. 水喷雾灭火", "C. 干粉灭火", "D. 石棉布捂盖燃烧物"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 14, "stem": "纸张、棉布的燃点在 130-350℃之间，而烟头表面温度在 200-300℃之间，其中心温度达（），所以乱扔烟头极易引发火灾。", "options": ["A.300-500℃", "B.700-800℃", "C.900-1000℃", "D.1100-1200℃"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 15, "stem": "检查燃气管道泄漏最简便有效的方法是（）。", "options": ["A. 涂抹肥皂水", "B. 划火柴", "C. 闻气味", "D. 听声音"], "answer": "A"}, {"paper": "C", "type": "choice", "no": 16, "stem": "无人员伤亡且直接财产损失低于 1000 元的火灾属于（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "D"}, {"paper": "C", "type": "choice", "no": 17, "stem": "烟气中的大多数气体均比空气重，但在高温情况下烟气仍向上浮动，所以室内的烟气越是高处浓度越高。据试验，在火灾发生之后 11 ～ 13 分钟内房间顶部的二氧化碳浓度约为（）%，中部约为 5%。地面约为 2%。", "options": ["A.7", "B.8", "C.9", "D.10"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 18, "stem": "将火源附近的可燃、易燃、易爆和助燃物品搬走；拆除与火源毗连的易燃建（构）筑物，形成阻止火势蔓延的空间地带属于（）机理。", "options": ["A. 冷却灭火", "B. 隔离灭火", "C. 窒息灭火", "D. 化学抑制灭火"], "answer": "B"}, {"paper": "C", "type": "choice", "no": 19, "stem": "下列物质发生的火灾，不属于 A 类火灾的是（）。", "options": ["A. 纸张", "B. 焦炭", "C. 沥青", "D. 橡胶"], "answer": "C"}, {"paper": "C", "type": "choice", "no": 20, "stem": "点型感温探测器，一种通过监测周围环境温度变化来识别火灾风险的消防设备。红色玻璃柱温感探测器的动作温度为（）℃（常见于普通场所喷淋系统）。", "options": ["A.4", "B.50", "C.68", "D.78"], "answer": "C"}, {"paper": "C", "type": "judge", "no": 1, "stem": "眼部烧伤，严禁用手或手帕等揉擦。（）", "answer": "√"}, {"paper": "C", "type": "judge", "no": 2, "stem": "厨房发生火灾后，如果火焰还很小，可以尝试用湿毛巾、灭火毯或防火毛巾等封闭火源，以切断氧气的供应。或者可以使用灭火器喷射消防泡沫，灭火器喷射距离一般在 1 ～ 3 米。（）", "answer": "√"}, {"paper": "C", "type": "judge", "no": 3, "stem": "配电线路中发生短路的表象特征为线路内电流急剧降低，使带电导体温度急剧降低，引燃电线电缆的绝缘外皮及周边可燃物，进而引发火灾。（）", "answer": "×"}, {"paper": "C", "type": "judge", "no": 4, "stem": "使用燃气时，应保持室内通风良好，不要远离厨房。（）", "answer": "√"}, {"paper": "C", "type": "judge", "no": 5, "stem": "A 类火灾指液体或可熔化的固体物质火灾。（）", "answer": "×"}, {"paper": "C", "type": "judge", "no": 6, "stem": "自动喷水—泡沫联用系统在喷水的同时喷出泡沫，泡沫覆盖于燃烧液体或固体的表面，在发挥冷却作用的同时，将可燃物与空气隔开，从而灭火属于窒息灭火。（）", "answer": "√"}, {"paper": "C", "type": "judge", "no": 7, "stem": "用水扑灭一般固体物质引起的火灾，主要是通过冷却作用来实现的，属于冷却灭火。（）", "answer": "√"}, {"paper": "C", "type": "judge", "no": 8, "stem": "较大火灾是指造成 3 人以上 10 人以下死亡，或者 10 人以上 30 人以下重伤，或者 3000 万元以上 1 亿元以下直接经济损失的火灾。（）", "answer": "×"}, {"paper": "C", "type": "judge", "no": 9, "stem": "配电线路接触不良是指配电线路的带电导体之间、带电导体与连接端子之间连接不可靠，导致接触电阻降低，在接头处产生高温，引燃周围可燃物从而引发火灾。（）", "answer": "×"}, {"paper": "C", "type": "judge", "no": 10, "stem": "下雨天电动车可以在门厅内充电。（）", "answer": "×"}, {"paper": "C", "type": "short", "no": 1, "stem": "普通员工的消防安全职责？", "answer": "（1）严格执行消防安全管理制度、规定及安全操作规程；（2）接受消防安全教育培训，掌握消防安全知识和逃生自救能力；（3）保护消防设施器材，保障消防车通道、疏散通道、安全出口畅通；（4）班前班后检查本岗位工作设施、设备、场地，发现隐患及时排除并向上级主管报告；（5）熟悉本单位及自身岗位火灾危险性、消防设施及器材、安全出口的位置，积极参加单位消防演练，发生火灾时，及时报警并引导人员疏散；（6）指导、督促外来人员遵守单位消防安全管理制度，制止影响消防安全的行为。"}, {"paper": "C", "type": "short", "no": 2, "stem": "什么是“三合一”建筑？有哪些特点？", "answer": "所谓“三合一”建筑就是有些企业在同时设置有厂房、仓库、员工宿舍的建筑中或是在居住用房等民用建筑中，从事生产、储存、经营等活动，而住宿部分与其他部分又未按规定采取必要的防火分隔和设置消防设施，其消防安全条件与建筑使用性质不相适应，具有较高的火灾危险性的建筑物。这种建筑物的特点是存放易燃易爆物品多，聚集人员多，用火用电多，建筑设施简陋，内部拥挤不堪，安全疏散不畅。有的业主为了防盗，在窗户上安设防盗网，在走道、楼梯上安装防盗门。同时，这类建筑物内的消防设施不全、管理不善，员工缺乏应有的消防安全常识，不经培训就上岗，没有最起码的自防自救能力，并且这类建筑往往是在城乡结合或者小镇上，距离消防救援队较远。故一旦“三合一”建筑发生火灾，极易造成群死群伤的结果。"}, {"paper": "D", "type": "fill", "no": 1, "stem": "特别重大火灾指造成 30 人以上死亡，或者 100 人以上重伤和死亡，或者受灾 100 户以上，或者_____亿元以上直接财产损失的火灾。", "answer": "3"}, {"paper": "D", "type": "fill", "no": 2, "stem": "一旦发生烧（烫）伤，最简单而有效的急救处理是冷疗，即用凉水冲洗或将烧伤处放入凉水中_____至 20 分钟，可使烧伤程度减轻并减少疼痛感。", "answer": "10"}, {"paper": "D", "type": "fill", "no": 3, "stem": "近年来，我国发生的电气火灾每年都在 10 万起以上，占全年火灾总数的_____% 左右，导致的人员伤亡及经济损失在各类火灾中居首位。", "answer": "30"}, {"paper": "D", "type": "fill", "no": 4, "stem": "燃烧的发生和发展，必须具备三个必要条件，即可燃物、助燃物和_____，通常称为燃烧三要素。", "answer": "引火源"}, {"paper": "D", "type": "fill", "no": 5, "stem": "热传播有三种方式：热传导、热对流和_____。", "answer": "热辐射"}, {"paper": "D", "type": "fill", "no": 6, "stem": "通过灌注惰性气体（如二氧化碳、氮气、水蒸气等）来降低空间的氧浓度，从而达到灭火的目的属于_____火。", "answer": "窒息"}, {"paper": "D", "type": "fill", "no": 7, "stem": "火灾隐患可分为：_____、一般火灾隐患。", "answer": "重大火灾隐患"}, {"paper": "D", "type": "fill", "no": 8, "stem": "轻微火灾：无人员伤亡且直接财产损失低于_____元的火灾。", "answer": "1000"}, {"paper": "D", "type": "fill", "no": 9, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于_____% 时，就不能维持燃烧。", "answer": "15"}, {"paper": "D", "type": "fill", "no": 10, "stem": "购买电器的时候应该选择具有安全认证标志的产品。_____认证对于中国市场的电器是必需的。", "answer": "CCC"}, {"paper": "D", "type": "choice", "no": 1, "stem": "（）是将水流信号转换为电信号的一种报警触发装置，一般安装在自动喷水灭火系统中每个防火分区或楼层的配水干管（或配水管）上，其作用是监测配水管内的水流（当流量达到设定值时），向消防控制室发送电信号，以指示该防火分区或楼层内有喷头开启（可能发生火灾）。", "options": ["A. 水力警铃", "B. 压力开关", "C. 水流指示器", "D. 末端试水装置"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 2, "stem": "利用灭火毯、沙土等覆盖燃烧物，这种灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 3, "stem": "《火灾分类》（GB/T 4968-2008）规定，火灾根据可燃物的类型和燃烧特性，可以分为（）大类。", "options": ["A. 三", "B. 四", "C. 五", "D. 六"], "answer": "D"}, {"paper": "D", "type": "choice", "no": 4, "stem": "如果您有一辆电动自行车，您应该（）。", "options": ["A. 将电池带回家中充电", "B. 改装电动自行车", "C. 私拉电线和插座充电", "D. 经常检查维护"], "answer": "D"}, {"paper": "D", "type": "choice", "no": 5, "stem": "根据《中华人民共和国消防法》的规定，消防工作的原则是（）。", "options": ["A. 政府统一领导、部门依法监管、单位全面负责、公民积极参与", "B. 消防安全责任制", "C. 专门机关和群众相结合", "D. 预防为主、防消结合"], "answer": "A"}, {"paper": "D", "type": "choice", "no": 6, "stem": "点型感温探测器，一种通过监测周围环境温度变化来识别火灾风险的消防设备。红色玻璃柱温感探测器的动作温度为（）℃（常见于普通场所喷淋系统）。", "options": ["A.4", "B.50", "C.68", "D.78"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 7, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于（）时，就不能维持燃烧。", "options": ["A.5%", "B.10%", "C.15%", "D.20%"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 8, "stem": "以下（）行为是正确的。", "options": ["A. 用取暖器烘烤衣物", "B. 同时使用多个大功率电器", "C. 电子设备充完电后及时拔掉插头", "D. 电器长时间通电运行"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 9, "stem": "纸张、棉布的燃点在 130-350℃之间，而烟头表面温度在 200-300℃之间，其中心温度达（），所以乱扔烟头极易引发火灾。", "options": ["A.300-500℃", "B.700-800℃", "C.900-1000℃", "D.1100-1200℃"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 10, "stem": "灭火器正确使用的四字口诀指（）。", "options": ["A. “提、拔、对、喷”", "B. “提、拔、握、压”", "C. “提、摇、握、压”", "D. “提、摇、对、喷”"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 11, "stem": "将火源附近的可燃、易燃、易爆和助燃物品搬走；拆除与火源毗连的易燃建（构）筑物，形成阻止火势蔓延的空间地带属于（）机理。", "options": ["A. 冷却灭火", "B. 隔离灭火", "C. 窒息灭火", "D. 化学抑制灭火"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 12, "stem": "火灾的种类按燃烧物的性质划分，共分为 A、B、C、D、E、F 六类。由石蜡所引起的火灾，属于（）火灾。", "options": ["A.A 类", "B.B 类", "C.C 类", "D.D 类"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 13, "stem": "下列灭火方法中属于化学抑制的是（）。", "options": ["A. 二氧化碳灭火", "B. 水喷雾灭火", "C. 干粉灭火", "D. 石棉布捂盖燃烧物"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 14, "stem": "2024 年 2 月 23 日凌晨 4 时 35 分许，南京市雨花台区西柿路 9 号明尚西苑小区居民住宅 6 号楼发生火灾事故，造成 15 人死亡、2 人重伤、42 人轻伤或轻微伤，直接经济损失 3300 余万元。经调查认定，这是一起违规改装的电动自行车超标大容量锂离子电池热失控起火引起的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 一般火灾"], "answer": "B"}, {"paper": "D", "type": "choice", "no": 15, "stem": "往燃烧物上喷射七氟丙烷灭火剂、干粉灭火剂，中断燃烧链式反应，这样的灭火方法称为（）。", "options": ["A. 冷却灭火法", "B. 窒息灭火法", "C. 隔离灭火法", "D. 化学抑制灭火法"], "answer": "D"}, {"paper": "D", "type": "choice", "no": 16, "stem": "检查燃气管道泄漏最简便有效的方法是（）。", "options": ["A. 涂抹肥皂水", "B. 划火柴", "C. 闻气味", "D. 听声音"], "answer": "A"}, {"paper": "D", "type": "choice", "no": 17, "stem": "2024 年 1 月 24 日 15 时许，江西省新余市渝水区一临街店铺发生火灾，事故已造成 39 人死亡、9 人受伤。起火建筑为六层商住一体砖混结构建筑，起火部位在负一楼，并迅速蔓延至一楼、二楼的商业店铺。经初步查明，该楼地下一层正在进行冷库装修，该起事故是因施工人员违规动火施工造成的（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "A"}, {"paper": "D", "type": "choice", "no": 18, "stem": "下列物质用作灭火剂时，不具有窒息灭火机理的是（）。", "options": ["A. 二氧化碳", "B. 泡沫", "C. 直流水", "D. 水蒸气"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 19, "stem": "下列物质发生的火灾，不属于 A 类火灾的是（）。", "options": ["A. 纸张", "B. 焦炭", "C. 沥青", "D. 橡胶"], "answer": "C"}, {"paper": "D", "type": "choice", "no": 20, "stem": "在家外失火的情况下，有毒烟气已封锁逃生通道，被困人员采取的最佳方式是（）。", "options": ["A. 冒险跳楼", "B. 立即开门向外跑", "C. 关好房门，固守待援", "D. 乘坐电梯逃生"], "answer": "C"}, {"paper": "D", "type": "judge", "no": 1, "stem": "人身着火时，身上如果穿的是单衣，应迅速趴在地上；背后衣服着火时，应仰面躺在地上；衣服前后都着火时，则应在地上来回滚动，利用身体隔绝空气，覆盖火焰，窒息灭火。（）", "answer": "√"}, {"paper": "D", "type": "judge", "no": 2, "stem": "发现火情可以打开门窗逃生。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 3, "stem": "较大火灾是指造成 3 人以上 10 人以下死亡，或者 10 人以上 30 人以下重伤，或者 3000 万元以上 1 亿元以下直接经济损失的火灾。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 4, "stem": "火源附近的可燃、易燃、易爆和助燃物品搬走属于窒息灭火。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 5, "stem": "防火分隔物是防止火灾由内部向外部蔓延的一项重要措施。（）", "answer": "√"}, {"paper": "D", "type": "judge", "no": 6, "stem": "配电线路中发生短路的表象特征为线路内电流急剧降低，使带电导体温度急剧降低，引燃电线电缆的绝缘外皮及周边可燃物，进而引发火灾。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 7, "stem": "A 类火灾指液体或可熔化的固体物质火灾。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 8, "stem": "电动车可以在建筑首层门厅、楼梯间、疏散通道、安全出口等公共区域停放。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 9, "stem": "配电线路接触不良是指配电线路的带电导体之间、带电导体与连接端子之间连接不可靠，导致接触电阻降低，在接头处产生高温，引燃周围可燃物从而引发火灾。（）", "answer": "×"}, {"paper": "D", "type": "judge", "no": 10, "stem": "眼部烧伤，严禁用手或手帕等揉擦。（）", "answer": "√"}, {"paper": "D", "type": "short", "no": 1, "stem": "消防工作的重要性有哪些？", "answer": "消防是一种公共安全事务，其重要性主要体现在以下几个方面。一是保护人民生命和财产的安全。消防工作旨在减少火灾发生的概率和破坏力度，保护和保障人民生命财产安全。二是有效防止和控制火灾。消防人员对可能发生的火灾进行预防，并根据实际情况采取必要的措施，有效地防止和控制火灾，以减少火灾造成的损失和危害。三是促进社会和谐发展。消防工作是社会发展的重要组成部分，可以帮助建立和谐、安全的社会环境，促进社会的发展。"}, {"paper": "D", "type": "short", "no": 2, "stem": "消防安全“四懂四会”是什么？", "answer": "“四懂”是指懂得岗位火灾的危险性，懂得预防火灾的措施，懂得扑救火灾的方法，懂得逃生路线和方法。“四会”是指会使用消防器材，会报火警，会扑救初起火灾，会组织疏散逃生。"}, {"paper": "E", "type": "fill", "no": 1, "stem": "热传播有三种方式：热传导、热对流和_____。", "answer": "热辐射"}, {"paper": "E", "type": "fill", "no": 2, "stem": "燃烧的发生和发展，必须具备三个必要条件，即可燃物、助燃物和_____，通常称为燃烧三要素。", "answer": "引火源"}, {"paper": "E", "type": "fill", "no": 3, "stem": "购买电器的时候应该选择具有安全认证标志的产品。_____认证对于中国市场的电器是必需的。", "answer": "CCC"}, {"paper": "E", "type": "fill", "no": 4, "stem": "近年来，我国发生的电气火灾每年都在 10 万起以上，占全年火灾总数的_____% 左右，导致的人员伤亡及经济损失在各类火灾中居首位。", "answer": "30"}, {"paper": "E", "type": "fill", "no": 5, "stem": "通过灌注惰性气体（如二氧化碳、氮气、水蒸气等）来降低空间的氧浓度，从而达到灭火的目的属于_____火。", "answer": "窒息"}, {"paper": "E", "type": "fill", "no": 6, "stem": "轻微火灾：无人员伤亡且直接财产损失低于_____元的火灾。", "answer": "1000"}, {"paper": "E", "type": "fill", "no": 7, "stem": "特别重大火灾指造成 30 人以上死亡，或者 100 人以上重伤和死亡，或者受灾 100 户以上，或者_____亿元以上直接财产损失的火灾。", "answer": "3"}, {"paper": "E", "type": "fill", "no": 8, "stem": "可燃物的燃烧是氧化作用，需要在最低氧浓度以上才能进行，低于最低氧浓度，燃烧不能进行，火灾即被扑灭。一般氧浓度低于_____% 时，就不能维持燃烧。", "answer": "15"}, {"paper": "E", "type": "fill", "no": 9, "stem": "一旦发生烧（烫）伤，最简单而有效的急救处理是冷疗，即用凉水冲洗或将烧伤处放入凉水中_____至 20 分钟，可使烧伤程度减轻并减少疼痛感。", "answer": "10"}, {"paper": "E", "type": "fill", "no": 10, "stem": "火灾隐患可分为：_____、一般火灾隐患。", "answer": "重大火灾隐患"}, {"paper": "E", "type": "choice", "no": 1, "stem": "无人员伤亡且直接财产损失低于 1000 元的火灾属于（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "D"}, {"paper": "E", "type": "choice", "no": 2, "stem": "火灾的种类按燃烧物的性质划分，共分为 A、B、C、D、E、F 六类。由石蜡所引起的火灾，属于（）火灾。", "options": ["A.A 类", "B.B 类", "C.C 类", "D.D 类"], "answer": "B"}, {"paper": "E", "type": "choice", "no": 3, "stem": "下列物质用作灭火剂时，不具有窒息灭火机理的是（）。", "options": ["A. 二氧化碳", "B. 泡沫", "C. 直流水", "D. 水蒸气"], "answer": "C"}, {"paper": "E", "type": "choice", "no": 4, "stem": "《火灾分类》（GB/T 4968-2008）规定，火灾根据可燃物的类型和燃烧特性，可以分为（）大类。", "options": ["A. 三", "B. 四", "C. 五", "D. 六"], "answer": "D"}, {"paper": "E", "type": "choice", "no": 5, "stem": "油锅起火时，最佳的灭火方式是（）。", "options": ["A. 用嘴吹", "B. 用水灭火", "C. 迅速盖上锅盖或灭火毯", "D. 不处理，等待火势变小"], "answer": "C"}, {"paper": "E", "type": "choice", "no": 6, "stem": "点型感温探测器，一种通过监测周围环境温度变化来 wer": "D"}, {"paper": "E", "type": "choice", "no": 18, "stem": "2024 年 4 月 4 日 4 时 12 分许，广东省东莞市万江街道东莞康怡护理院发生火灾。过火面积约 20m²,造成 4 人死亡、9 人受伤。事故直接原因为 303 房间 9 号床上由打火机明火引燃床上可燃物品，该起事故属于（）责任事故。", "options": ["A. 特别重大火灾", "B. 重大火灾", "C. 较大火灾", "D. 轻微火灾"], "answer": "C"}, {"paper": "E", "type": "choice", "no": 19, "stem": "根据《中华人民共和国消防法》的规定，我国消防工作贯彻（）的方针。", "options": ["A. 以消为主，以防为辅", "B. 预防为主，防消结合", "C. 预防为主，消防结合", "D. 以防为主，以消为辅"], "answer": "B"}, {"paper": "E", "type": "choice", "no": 20, "stem": "灭火器正确使用的四字口诀指（）。", "options": ["A. “提、拔、对、喷”", "B. “提、拔、握、压”", "C. “提、摇、握、压”", "D. “提、摇、对、喷”"], "answer": "B"}, {"paper": "E", "type": "judge", "no": 1, "stem": "发现火情可以打开门窗逃生。（）", "answer": "×"}, {"paper": "E", "type": "judge", "no": 2, "stem": "下雨天电动车可以在门厅内充电。（）", "answer": "×"}, {"paper": "E", "type": "judge", "no": 3, "stem": "防火分隔物是防止火灾由内部向外部蔓延的一项重要措施。（）", "answer": "√"}, {"paper": "E", "type": "judge", "no": 4, "stem": "当厨房发生油火时，可以用水灭火。（）", "answer": "×"}, {"paper": "E", "type": "judge", "no": 5, "stem": "在电器使用过程中，要使用具有过载保护功能的插座。（）", "answer": "√"}, {"paper": "E", "type": "judge", "no": 6, "stem": "火源附近的可燃、易燃、易爆和助燃物品搬走属于窒息灭火。（）", "answer": "×"}, {"paper": "E", "type": "judge", "no": 7, "stem": "人身着火时，身上如果穿的是单衣，应迅速趴在地上；背后衣服着火时，应仰面躺在地上；衣服前后都着火时，则应在地上来回滚动，利用身体隔绝空气，覆盖火焰，窒息灭火。（）", "answer": "√"}, {"paper": "E", "type": "judge", "no": 8, "stem": "配电线路接触不良是指配电线路的带电导体之间、带电导体与连接端子之间连接不可靠，导致接触电阻降低，在接头处产生高温，引燃周围可燃物从而引发火灾。（）", "answer": "×"}, {"paper": "E", "type": "judge", "no": 9, "stem": "自动喷水—泡沫联用系统在喷水的同时喷出泡沫，泡沫覆盖于燃烧液体或固体的表面，在发挥冷却作用的同时，将可燃物与空气隔开，从而灭火属于窒息灭火。（）", "answer": "√"}, {"paper": "E", "type": "judge", "no": 10, "stem": "厨房发生火灾后，如果火焰还很小，可以尝试用湿毛巾、灭火毯或防火毛巾等封闭火源，以切断氧气的供应。或者可以使用灭火器喷射消防泡沫，灭火器喷射距离一般在 1 ～ 3 米。（）", "answer": "√"}, {"paper": "E", "type": "short", "no": 1, "stem": "消防安全“四个能力”是什么？", "answer": "（1）检查消除火灾隐患能力。（2）扑救初期火灾能力。（3）组织人员疏散逃生能力。（4）消防宣传教育培训能力。"}, {"paper": "E", "type": "short", "no": 2, "stem": "消防安全“四懂四会”是什么？", "answer": "“四懂”是指懂得岗位火灾的危险性，懂得预防火灾的措施，懂得扑救火灾的方法，懂得逃生路线和方法。“四会”是指会使用消防器材，会报火警，会扑救初起火灾，会组织疏散逃生。"}];

// ===== 状态管理（localStorage 持久化） =====
const LS_KEY = "fire_quiz_v1";
let state = {
  mode: "paper",        // paper | wrong
  paper: "ALL",
  type: "ALL",
  order: [],            // 当前题序（索引数组）
  idx: 0,
  answered: {},         // qid -> {ok: bool, my: ...}
  wrongIds: [],         // 错题 qid 列表
  totalAnswered: 0,
  totalOk: 0,
};
function loadState() {
  try { const s = localStorage.getItem(LS_KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e) {}
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function qidOf(q, i) { return q.paper + "-" + q.type + "-" + q.no + "-" + i; }

// ===== 题序生成 =====
function filterQuestions() {
  let list = QUESTIONS.map((q, i) => ({q, i}));
  if (state.paper !== "ALL") list = list.filter(x => x.q.paper === state.paper);
  if (state.type !== "ALL") list = list.filter(x => x.q.type === state.type);
  if (state.mode === "wrong") {
    const w = new Set(state.wrongIds);
    list = list.filter(x => w.has(qidOf(x.q, x.i)));
  }
  return list.map(x => x.i);
}

// ===== 渲染 =====
function render() {
  const area = document.getElementById("quiz-area");
  const empty = document.getElementById("empty");
  if (!state.order.length) {
    area.innerHTML = "";
    empty.style.display = "block";
    document.getElementById("stats-row").style.display = "none";
    return;
  }
  empty.style.display = "none";
  document.getElementById("stats-row").style.display = "grid";

  const i = state.order[state.idx];
  const q = QUESTIONS[i];
  const qid = qidOf(q, i);
  const answered = state.answered[qid];

  // 进度条
  const done = Object.keys(state.answered).length;
  document.getElementById("p-pos").textContent = (state.idx+1) + "/" + state.order.length;
  document.getElementById("p-bar").style.width = ((state.idx+1)/state.order.length*100) + "%";
  document.getElementById("p-pct").textContent = Math.round(done/QUESTIONS.length*100) + "%";

  const typeName = {choice:"选择题", judge:"判断题", fill:"填空题", short:"简答题"}[q.type];
  let html = '<div class="card">';
  html += `<div class="q-head"><span>卷${q.paper} · ${typeName} · 第${q.no}题</span><span class="tag">${state.idx+1}/${state.order.length}</span></div>`;
  html += `<div class="q-stem">${escapeHtml(q.stem)}</div>`;

  if (q.type === "choice") {
    html += '<div class="opt-list">';
    q.options.forEach((opt, oi) => {
      const letter = opt.match(/^([A-E])[.、]/);
      const cls = answered ? (letter && letter[1] === q.answer ? "correct" : (answered.my === letter[1] ? "wrong" : "")) : "";
      html += `<div class="opt ${cls}" onclick="answer('${qid}','${letter ? letter[1] : ""}')">${escapeHtml(opt)}</div>`;
    });
    html += '</div>';
  } else if (q.type === "judge") {
    html += '<div class="judge-row">';
    ["√","×"].forEach(v => {
      const cls = answered ? (v === q.answer ? "correct" : (answered.my === v ? "wrong" : "")) : "";
      html += `<div class="judge-btn ${cls}" onclick="answer('${qid}','${v}')">${v}</div>`;
    });
    html += '</div>';
  } else if (q.type === "fill") {
    html += `<input class="fill-input" id="fill-input" type="text" placeholder="请输入答案" value="${answered && answered.my ? escapeHtml(String(answered.my)) : ""}">`;
    html += `<button class="fill-submit" onclick="submitFill('${qid}')">提交答案</button>`;
  } else { // short
    html += '<div class="short-ans"><details><summary>查看参考答案</summary><div class="ans-body">' + escapeHtml(q.answer) + '</div></details></div>';
    if (!answered) {
      html += '<div class="self-row">';
      html += `<button class="self-btn self-ok" onclick="answer('${qid}','self-ok')">✅ 我答对了</button>`;
      html += `<button class="self-btn self-no" onclick="answer('${qid}','self-no')">❌ 我没答对</button>`;
      html += '</div>';
    }
  }

  if (answered && q.type !== "short") {
    const ok = answered.ok;
    html += `<div class="feedback show ${ok ? "ok" : "err"}">${ok ? "✅ 回答正确！" : "❌ 回答错误"}`;
    if (!ok) html += `<br>正确答案：<b>${escapeHtml(String(q.answer))}</b>`;
    html += '</div>';
  } else if (answered && q.type === "short" && answered.my) {
    const ok = answered.ok;
    html += `<div class="feedback show ${ok ? "ok" : "err"}">${ok ? "✅ 自评：答对了！" : "❌ 自评：没答对（已加入错题本）"}</div>`;
  }
  html += '</div>';
  area.innerHTML = html;
  if (q.type === "fill" && !answered) {
    const inp = document.getElementById("fill-input");
    if (inp) inp.focus();
  }

  // 统计（放在最后，确保 short 自动记录已计入）
  document.getElementById("s-total").textContent = state.totalAnswered;
  document.getElementById("s-ok").textContent = state.totalOk;
  document.getElementById("s-rate").textContent = state.totalAnswered ? Math.round(state.totalOk/state.totalAnswered*100) + "%" : "0%";
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===== 答题 =====
function answer(qid, val) {
  if (state.answered[qid]) return;
  const i = state.order[state.idx];
  const q = QUESTIONS[i];
  // 简答题：自评模式（self-ok=self-ok 判对，self-no 判错）；其他题型：严格匹配
  let ok;
  if (q.type === "short") ok = val === "self-ok";
  else ok = val === q.answer;
  record(qid, ok, val);
  render();
}
function submitFill(qid) {
  if (state.answered[qid]) return;
  const val = document.getElementById("fill-input").value;
  const i = state.order[state.idx];
  const q = QUESTIONS[i];
  // 严格匹配：trim 后完全一致
  const ok = val.trim() === q.answer.trim();
  record(qid, ok, val.trim());
  render();
}
function record(qid, ok, my) {
  state.answered[qid] = {ok, my};
  state.totalAnswered++;
  if (ok) state.totalOk++;
  else if (!state.wrongIds.includes(qid)) state.wrongIds.push(qid);
  saveState();
}

// ===== 导航 =====
function next() {
  if (state.idx < state.order.length - 1) { state.idx++; saveState(); render(); }
}
function prev() {
  if (state.idx > 0) { state.idx--; saveState(); render(); }
}

// ===== 工具栏 =====
document.getElementById("paper-select").value = state.paper;
document.getElementById("type-select").value = state.type;
document.getElementById("paper-select").onchange = e => { state.paper = e.target.value; state.mode="paper"; state.idx=0; state.order=filterQuestions(); saveState(); render(); };
document.getElementById("type-select").onchange = e => { state.type = e.target.value; state.mode="paper"; state.idx=0; state.order=filterQuestions(); saveState(); render(); };
document.getElementById("btn-random").onclick = () => {
  const list = filterQuestions().slice();
  for (let i=list.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  state.order = list; state.idx = 0; saveState(); render();
};
document.getElementById("btn-wrong").onclick = () => {
  state.mode = state.mode === "wrong" ? "paper" : "wrong";
  document.getElementById("btn-wrong").classList.toggle("active", state.mode === "wrong");
  state.idx = 0; state.order = filterQuestions(); saveState(); render();
};
document.getElementById("btn-next").onclick = next;
document.getElementById("btn-prev").onclick = prev;
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "Enter") next();
  if (e.key === "ArrowLeft") prev();
});

function resetProgress() {
  if (!confirm("确定清除全部进度和错题记录？")) return;
  state = { mode:"paper", paper:"ALL", type:"ALL", order:[], idx:0, answered:{}, wrongIds:[], totalAnswered:0, totalOk:0 };
  state.order = filterQuestions();
  saveState(); render();
}
window.resetProgress = resetProgress;

// ===== 启动 =====
loadState();
state.order = filterQuestions();
render();
</script>
</body>
</html>
